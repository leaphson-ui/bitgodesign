<svg xmlns="http://www.w3.org/2000/svg" aria-label="Bitcoin’s five-minute move after a CPI surprise" height="250" role="img" viewBox="0 0 480 250" width="480"><title>Bitcoin’s five-minute move after a CPI surprise</title><defs><linearGradient id="cpi-platinum" x2="0" y2="1"><stop stop-color="#d9dce0"></stop><stop offset="1" stop-color="#6a6d73"></stop></linearGradient><linearGradient id="cpi-orange" x2="0" y2="1"><stop stop-color="#ffa158"></stop><stop offset="1" stop-color="#fa5d00"></stop></linearGradient></defs><rect fill="#000" height="100%" width="100%"></rect><rect fill="url(#cpi-orange)" height="10" width="10"></rect><text fill="#969696" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="start" x="16" y="10">Hotter than expected</text><rect fill="#8d939c" height="10" width="10" x="174"></rect><text fill="#969696" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="start" x="190" y="10">Cooler</text><line stroke="#262628" x1="0" x2="480" y1="180" y2="180"></line><line stroke="#262628" x1="0" x2="480" y1="128" y2="128"></line><line stroke="#262628" x1="0" x2="480" y1="76" y2="76"></line><rect fill="url(#cpi-orange)" height="5.2" rx="2" width="36" x="40" y="122.8"></rect><text fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" x="58" y="114.8">+0.1%</text><rect fill="#8d939c" height="10.4" rx="2" width="36" x="84" y="128"></rect><text fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" x="102" y="158.4">−0.2%</text><text fill="#969696" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" x="80" y="242">Before 2020</text><rect fill="url(#cpi-orange)" height="72.8" rx="2" width="36" x="200" y="128"></rect><text fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" x="218" y="220.8">−1.4%</text><rect fill="#8d939c" height="88.39999999999999" rx="2" width="36" x="244" y="39.60000000000001"></rect><te